[workspace]
resolver = "2"
members = ["crates/arcade-store", "crates/arcade-chain", "crates/arcade-arc", "crates/arcade-chaindb", "crates/arcade-mesh", "crates/arcade-ledger", "crates/arcade-wallet", "crates/arcade-msg", "crates/arcade-app", "crates/arcaded", "crates/arcade-cli", "crates/arcade-desktop", "crates/arcade-oldimport"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"

# libbitcoinconsensus with one addition: a per-thread signature-hash prefix, for chains that hash
# a chain id ahead of each signature's message (Luckycoin). See vendor/bitcoinconsensus/ARCADE.md.
[patch.crates-io]
bitcoinconsensus = { path = "vendor/bitcoinconsensus" }
