<script type="application/arcade-theme+json">{"arcade_theme":1,"name":"Windows 98","layout":"desktop","colors":{"light":{"bg":"#c0c0c0","panel":"#ffffff","panel-2":"#dfdfdf","ink":"#000000","muted":"#404040","line":"#808080","accent":"#000080","accent-ink":"#ffffff","accent-soft":"#c8cce8","warn-bg":"#ffffe1","warn-line":"#000000","bad":"#a00000","faint":"#606060"}},"font":"tahoma","size":12,"radius":0,"brand":"ARCADE","desktop":{"bar":"bottom","dock":"none","topbar":"none","start":"Start","icons":true,"clock":true,"buttons":"right"},"chrome":".frame{font-family:Tahoma,\"Microsoft Sans Serif\",Geneva,Verdana,sans-serif;font-size:11px;color:#000;background:#c0c0c0}.desk{background:#008080}.icon{width:74px;gap:3px;color:#fff}.icon-label{text-shadow:1px 1px 0 #000;padding:1px 2px}.icon:focus-visible,.icon:active{outline:0}.icon:focus-visible .icon-label,.icon:active .icon-label{background:#000080;text-shadow:none;outline:1px dotted #ff0}.win,.startmenu{padding:3px;background:#c0c0c0;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #dfdfdf,inset -2px -2px #808080,inset 2px 2px #fff,2px 2px 6px rgba(0,0,0,.3)}.win.max{box-shadow:none}.titlebar{height:20px;gap:4px;padding:0 2px 0 3px;color:#c0c0c0;background:linear-gradient(90deg,#808080,#b5b5b5);font-weight:700}.win.active .titlebar,.smhead{color:#fff;background:linear-gradient(90deg,#000080,#1084d0)}.ticn{width:16px;height:16px}.tbtns{gap:0}.tbtn{width:16px;height:14px;font-size:9px;font-weight:700;color:#000}.tbtn,.start,.task{background:#c0c0c0;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}.tbtn:active,.start.on,.start:active,.task.on{box-shadow:inset -1px -1px #fff,inset 1px 1px #0a0a0a,inset -2px -2px #dfdfdf,inset 2px 2px #808080}.tclose{margin-left:2px}.win .wbody{margin-top:2px;padding:2px;background:#fff;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a}.bar{height:30px;gap:3px;padding:2px 2px 0;box-shadow:inset 0 1px #dfdfdf,inset 0 2px #fff}.start{height:24px;padding:2px 6px 2px 4px;font-weight:700}.task{height:24px;max-width:160px;padding:2px 6px}.task.on{font-weight:700;background:repeating-conic-gradient(#c0c0c0 0 25%,#fff 0 50%) 0 0/2px 2px}.tray{height:24px;padding:0 8px 0 4px;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080}.clock{min-width:52px;text-align:right}.smhead{padding:6px 8px;font-size:12px;font-weight:700}.smitem{padding:6px 18px 6px 6px;font-size:12px}.smitem .ticn{width:24px;height:24px}.smitem:hover,.smitem:focus-visible{background:#000080;color:#fff}.msep{height:2px;margin:3px 2px;box-shadow:inset 0 1px #808080,inset 0 -1px #fff}"}</script>
