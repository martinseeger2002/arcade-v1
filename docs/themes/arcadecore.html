<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArcadeCore theme</title>
<style>body{margin:0;padding:16px;font:14px/1.5 system-ui,sans-serif;background:#f4f4f4;color:#222}

h1{margin:0 0 4px;font-size:20px}p{margin:0 0 12px}.pv{max-width:640px}
.m{background:#efefef;color:#1d1d1d;border:1px solid #c4c4c4;font:13px system-ui,sans-serif}.mb,.sb{display:flex;background:#e4e4e4;border-bottom:1px solid #c4c4c4}.mb>*{padding:4px 10px}.mb .on{background:#3874d8;color:#fff}.tb{display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid #c4c4c4}.tb span{padding:5px 10px;border:1px solid transparent;border-radius:3px}.tb .sel{background:#fff;border-color:#c4c4c4;font-weight:600}.bd{height:150px;padding:12px}.cd{background:#fff;border:1px solid #c4c4c4;border-radius:3px;padding:10px}button{margin-left:8px;background:#3874d8;color:#fff;border:0;border-radius:3px;padding:3px 12px}.sb{justify-content:space-between;padding:3px 8px;border:0;border-top:1px solid #c4c4c4;font-size:12px}@media (prefers-color-scheme:dark){.m{background:#2b2b2b;color:#e6e6e6;border-color:#4a4a4a}.mb,.sb{background:#333;border-color:#4a4a4a}.tb{border-color:#4a4a4a}.tb .sel,.cd{background:#1f1f1f;border-color:#4a4a4a}}</style>
<script type="application/arcade-theme+json">{"arcade_theme":1,"name":"ArcadeCore","layout":"window","colors":{"light":{"bg":"#efefef","panel":"#ffffff","panel-2":"#e4e4e4","ink":"#1d1d1d","muted":"#666666","line":"#c4c4c4","accent":"#3874d8","accent-ink":"#ffffff","accent-soft":"#dce7f9","warn-bg":"#fff4e0","warn-line":"#e0b060","bad":"#c62828","faint":"#888888"},"dark":{"bg":"#2b2b2b","panel":"#1f1f1f","panel-2":"#333333","ink":"#e6e6e6","muted":"#a0a0a0","line":"#4a4a4a","accent":"#3570d4","accent-ink":"#ffffff","accent-soft":"#263a5c","warn-bg":"#3a2e14","warn-line":"#8a6a2a","bad":"#ef5350","faint":"#808080"}},"font":"system","size":13,"radius":3,"brand":"ArcadeCore","window":{"toolbar":true},"chrome":".frame{font-family:system-ui,-apple-system,\"Segoe UI\",Ubuntu,sans-serif;font-size:13px;line-height:1.4;color:#1d1d1d;background:#efefef}.menubar,.statusbar{background:#e4e4e4;border-bottom:1px solid #c4c4c4}.brand{padding:4px 10px;font-weight:700}.mbitem:hover,.mbitem.on,.mitem:hover{background:#3874d8;color:#fff}.menu{background:#fff;color:#1d1d1d;border:1px solid #c4c4c4;box-shadow:2px 3px 8px rgba(0,0,0,.2)}.mitem{padding:4px 18px}.msep{border-top:1px solid #c4c4c4}.toolbar{padding:4px 6px;border-bottom:1px solid #c4c4c4}.tbitem{border:1px solid transparent;border-radius:3px;cursor:pointer}.tbitem:hover{border-color:#c4c4c4}.tbitem.selected{background:#fff;border-color:#c4c4c4;font-weight:600}.statusbar{padding:3px 8px;border:0;border-top:1px solid #c4c4c4;font-size:12px}@media (prefers-color-scheme: dark){.frame,.menu{color:#e6e6e6;background:#2b2b2b}.menubar,.statusbar{background:#333}.menubar,.statusbar,.toolbar,.menu,.msep,.tbitem:hover{border-color:#4a4a4a}.menu{background:#1f1f1f}.mbitem:hover,.mbitem.on,.mitem:hover{background:#3d7be0}.tbitem.selected{background:#1f1f1f;border-color:#4a4a4a}}"}</script>
</head><body><h1>ArcadeCore</h1><p>The ArcadeCore window: a menu bar, a toolbar of the screens, a status bar. Light or dark as your system is.</p>
