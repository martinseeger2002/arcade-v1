[package]
name = "arcaded"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arcade-app = { version = "0.1.0", path = "../arcade-app" }
arcade-chain = { version = "0.1.0", path = "../arcade-chain" }
arcade-chaindb = { version = "0.1.0", path = "../arcade-chaindb" }
arcade-ledger = { version = "0.1.0", path = "../arcade-ledger" }
crypto_box = "0.9"
crypto_secretbox = { version = "0.1", features = ["salsa20"] }
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
arcade-msg = { version = "0.1.0", path = "../arcade-msg" }
arcade-mesh = { version = "0.1.0", path = "../arcade-mesh" }
arcade-store = { version = "0.1.0", path = "../arcade-store" }
arcade-wallet = { version = "0.1.0", path = "../arcade-wallet" }
base64 = "0.23.1"
blake2 = "0.10"
libc = "0.2"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "cookies"] }
ed25519-dalek = "2"
flate2 = "1.1.11"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
ed25519-dalek = "2"

[package.metadata.deb]
name = "arcade"
maintainer = "Martin Seeger <martin.seeger2002@gmail.com>"
extended-description = "Arcade V1.0: Pepecoin testnet node with the arcade mesh and @tags. Add-on chains install later."
section = "net"
priority = "optional"
maintainer-scripts = "../../packaging/"
depends = "libc6, libwebkit2gtk-4.1-0, libgtk-3-0, adduser, systemd"
assets = [
    ["target/release/arcaded", "usr/bin/", "755"],
    ["target/release/arcade", "usr/bin/", "755"],
    ["target/release/arcade-desktop", "usr/bin/", "755"],
    ["../../packaging/arcade.desktop", "usr/share/applications/", "644"],
    ["../arcade-desktop/icons/icon.png", "usr/share/icons/hicolor/256x256/apps/arcade.png", "644"],
    ["../../packaging/arcaded.service", "lib/systemd/system/", "644"],
    ["../../docs/PLAN.md", "usr/share/doc/arcade/", "644"],
]
