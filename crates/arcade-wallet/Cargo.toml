[package]
name = "arcade-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arcade-chain = { version = "0.1.0", path = "../arcade-chain" }
arcade-ledger = { version = "0.1.0", path = "../arcade-ledger" }
bip39 = { version = "2", features = ["rand"] }
getrandom = "0.2"
hex = "0.4.3"
hmac = "0.13.0"
secp256k1 = { version = "0.29", features = ["global-context", "recovery"] }
base64 = "0.23.1"
sha2 = "0.11.1"
thiserror = "1"
zeroize = "1.9.1"
