<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; font: 14px/1.5 system-ui, sans-serif; }
  .box { background: #fff; color: #1d231f; border-radius: 14px; padding: 18px 20px; max-width: 460px; width: calc(100% - 40px); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .box h3 { margin: 0 0 8px; font-size: 17px; }
  .box p { margin: 6px 0; overflow-wrap: anywhere; }
  .box .outs { margin: 6px 0; padding-left: 18px; font-size: 13px; color: #555; }
  .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .btns button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  .btns .yes { background: #2e8b44; color: #fff; border-color: #2e8b44; font-weight: 600; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #eee; font: 15px system-ui, sans-serif; padding: 24px; text-align: center; }
</style>
</head>
<body>
<!-- The app runs sandboxed (opaque origin, scripts only, no access to this window or the arcade
     API); it can only post messages here, and this page decides what to do with them. -->
<iframe id="app" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen; autoplay" referrerpolicy="unsafe-url"></iframe>
<div id="err"></div>
<script src="appwindow.js"></script>
</body>
</html>
