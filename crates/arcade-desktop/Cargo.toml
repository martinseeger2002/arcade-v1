[package]
name = "arcade-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arcade-local = { version = "0.1.0", path = "../arcade-local" }
base64 = "0.23.1"
serde_json = "1.0.154"
tauri = "2"

[build-dependencies]
tauri-build = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Windows: the WebView2 process-failed event and DestroyWindow (versions as tauri's own).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
