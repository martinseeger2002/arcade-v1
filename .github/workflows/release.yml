# Prebuilt downloads for the installers (scripts/install.sh, scripts/install.ps1), every platform from ONE commit.
#
# Push a tag like v0.1.1 (or run this workflow by hand with a version) and it builds arcaded, arcade and arcade-desktop
# from the tag's commit, one build matrix, and attaches them all to that one GitHub release:
#   arcade-v1-linux-x86_64.tar.gz      (+ .sha256)   Ubuntu 22.04 (glibc 2.35: Ubuntu 22.04+, Mint 21+, Debian 12+)
#   arcade-v1-linux-aarch64.tar.gz     (+ .sha256)
#   arcade-v1-windows-x86_64.zip       (+ .sha256)   MSVC; Windows 10/11 x64
#   arcade-v1-windows-x86_64-setup.exe (+ .sha256)   one-click installer; the payload zip's SHA-256 is inside it
#   arcade-v1-windows-x86_64-binaries.sha256         arcaded.exe, arcade.exe, arcade-desktop.exe, Install.exe, setup.exe
#   arcade-v1-windows-x86_64-payload.sha256          the zip the installer extracts, checked before it unpacks
#   arcade-v1-macos-aarch64.tar.gz     (+ .sha256)   for now only when the macOS build succeeds (not required yet)
#   arcade-v1-macos-x86_64.tar.gz      (+ .sha256)
# Windows binaries are Authenticode-signed when WINDOWS_CODESIGN_PFX is set (see scripts/windows/sign-authenticode.ps1).
# With no certificate in that secret, signing is skipped and the log says so. Linux archives get a detached
# minisign and/or GPG signature when those secrets are set (scripts/release/sign_linux.sh); the .sha256 is always published.
# The release job refuses to publish if a hash does not match, or if a signature is missing when its secret is set.
# Every archive carries COMMIT (the commit it was built from); the release job also refuses to publish unless every
# archive's COMMIT is the tag's commit and every required platform (Linux x86_64 + aarch64, Windows x86_64) built.
# No separate Windows releases (the old vX.Y.Z-windows pre-releases): a tag with a hyphen is refused.
# install.sh downloads arcade-v1-linux-<arch>.tar.gz. install.ps1 downloads arcade-v1-windows-x86_64.zip. Arcades
# take the same archives as program-<platform> files of the signed code release (scripts/code-publish.py).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.1"
        required: true

# Read-only by default: the build compiles every dependency's build scripts, so it gets no write token.
# Only the release job, which builds nothing, can publish.
permissions:
  contents: read

jobs:
  # The required builds. Each row's steps for the other system are skipped (if: runner.os == ...).
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
          - platform: windows-x86_64
            runner: windows-latest
            # Bitcoin Core's consensus library (crate bitcoinconsensus) builds secp256k1 statically;
            # on MSVC its header declares the functions as DLL imports unless SECP256K1_STATIC is
            # defined (link errors __imp_secp256k1_*). cl.exe adds CL to every compile.
            # Core 26's pubkey.cpp also calls the ElligatorSwift module, which the crate leaves out (GNU ld
            # drops the unused call on Linux; MSVC must resolve it): compile it in too.
            cl: /DSECP256K1_STATIC /DENABLE_MODULE_ELLSWIFT=1
            # libclang (bindgen) is older than the runner's newest MSVC STL wants: let bindgen read the headers anyway.
            bindgen: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    runs-on: ${{ matrix.runner }}
    env:
      CL: ${{ matrix.cl }}
      BINDGEN_EXTRA_CLANG_ARGS: ${{ matrix.bindgen }}
      ARCADE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # ---- Linux
      - name: Build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential pkg-config clang libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libgmp-dev cmake

      - name: Rust
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: runner.os == 'Linux'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        if: runner.os == 'Linux'
        run: |
          export LIBCLANG_PATH="$(dirname "$(ls /usr/lib/llvm-*/lib/libclang.so* | head -1)")"
          export BINDGEN_EXTRA_CLANG_ARGS="-I$(gcc -print-file-name=include)"
          cargo build --release --locked -p arcaded -p arcade-cli -p arcade-signer -p arcade-desktop

      - name: Package
        if: runner.os == 'Linux'
        run: |
          name=arcade-v1-${{ matrix.platform }}
          mkdir -p "$name/bin" "$name/scripts"
          cp target/release/arcaded target/release/arcade target/release/arcade-signer target/release/arcade-desktop "$name/bin/"
          strip "$name"/bin/*
          cp crates/arcade-desktop/icons/icon.png "$name/icon.png"
          cp scripts/install-linux.sh "$name/scripts/"
          git rev-parse HEAD > "$name/COMMIT"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: arcade-v1-${{ matrix.platform }}
          path: arcade-v1-${{ matrix.platform }}.tar.gz*

      # ---- Windows
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: runner.os == 'Windows'

      - name: "LLVM (libclang for libmdbx and chiavdf: the MSVC headers want Clang 20 or newer)"
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: "20.1.8"

      - name: MSVC headers for bindgen
        if: runner.os == 'Windows'
        shell: pwsh
        run: . .\scripts\msvc-env.ps1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.os == 'Windows'

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # chiavdf (the ARCADE chain's proof of time) links MPIR's DLLs: on the PATH for the tests.
          cargo fetch --locked
          $mpir = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" -Recurse -Directory -Filter mpir_gc_x64 | Select-Object -First 1
          if ($mpir) { $env:PATH = "$($mpir.FullName);$env:PATH" }
          cargo test --locked --workspace --exclude arcade-desktop -- --test-threads=2

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --locked -p arcaded -p arcade-cli -p arcade-signer -p arcade-desktop

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = 'arcade-v1-${{ matrix.platform }}'
          New-Item -ItemType Directory -Force -Path "$name\bin","$name\scripts" | Out-Null
          Copy-Item target\release\arcaded.exe,target\release\arcade.exe,target\release\arcade-signer.exe,target\release\arcade-desktop.exe "$name\bin\"
          # MPIR (LGPL), which chiavdf links on Windows: its DLLs beside arcaded.exe, with its license.
          $mpir = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" -Recurse -Directory -Filter mpir_gc_x64 | Select-Object -First 1
          if (-not $mpir) { throw 'MPIR (chiavdf) not found in the cargo registry' }
          Copy-Item (Join-Path $mpir.FullName 'mpir*.dll') "$name\bin\"
          Copy-Item (Join-Path $mpir.FullName 'LICENSE') "$name\bin\MPIR-LICENSE.txt"
          Copy-Item crates\arcade-desktop\icons\icon.png,crates\arcade-desktop\icons\icon.ico $name
          Copy-Item scripts\install.ps1,scripts\uninstall.ps1 "$name\scripts\"
          # A double-click way in at the top of the folder without the installer program.
          Copy-Item scripts\windows\Install-PowerShell.cmd $name
          git rev-parse HEAD | Set-Content "$name\COMMIT" -Encoding ascii -NoNewline
          # Zipped after the installer is built (next step), so the zip carries it as Install.exe.

      - name: Sign programs (Authenticode)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          # Before the payload zip is hashed, so the signed programs are what the installer extracts.
          # No certificate yet: the script exits 0 and names the secret Martin has to add.
          $name = 'arcade-v1-${{ matrix.platform }}'
          & .\scripts\windows\sign-authenticode.ps1 "$name\bin\arcaded.exe" "$name\bin\arcade.exe" "$name\bin\arcade-desktop.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed ($LASTEXITCODE)" }

      - name: One-click installer (Setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          # The packaged folder above, as one zip the installer refuses to unpack until its SHA-256
          # matches the hash compiled into the stub (scripts/windows/setup.nsi, Verify-Payload.ps1).
          # Install.exe is a copy of the signed setup.exe, added after the payload zip is hashed,
          # so the installer does not carry a copy of itself.
          $name = 'arcade-v1-${{ matrix.platform }}'
          $payload = "$name-payload.zip"
          if (Test-Path $payload) { Remove-Item $payload -Force }
          Compress-Archive -Path $name -DestinationPath $payload
          $payloadHash = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$pwd\$name-payload.sha256", "$payloadHash  $name-payload`n")
          # NSIS isn't on every runner image: install it when missing, then find makensis wherever it landed.
          function Find-Makensis {
            $c = @((Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'), (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'),
                   (Join-Path $env:ProgramFiles 'NSIS\Bin\makensis.exe'), (Join-Path ${env:ProgramFiles(x86)} 'NSIS\Bin\makensis.exe'))
            $hit = $c | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $hit) { $hit = (Get-Command makensis -ErrorAction SilentlyContinue).Source }
            $hit
          }
          $nsis = Find-Makensis
          if (-not $nsis) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
            $nsis = Find-Makensis
          }
          if (-not $nsis) { throw "makensis.exe not found after installing NSIS" }
          Write-Host "makensis: $nsis"
          $stub = "$name-setup-stub.exe"
          & $nsis /NOCD /V2 "/DVERSION=$env:ARCADE_VERSION" "/DPKG=$name" "/DOUT=$stub" "/DPAYLOAD_SHA256=$payloadHash" scripts\windows\setup.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          $python = "python"
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            if (Get-Command py -ErrorAction SilentlyContinue) { $python = "py" } else { throw "Python is required to append the installer payload" }
          }
          & $python scripts\release\payload_trailer.py append --stub $stub --payload $payload --out "$name-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "payload append failed ($LASTEXITCODE)" }
          Remove-Item $stub, $payload -Force
          & $python scripts\release\payload_trailer.py check --installer "$name-setup.exe" --expected $payloadHash
          if ($LASTEXITCODE -ne 0) { throw "installer payload does not match the embedded SHA-256" }
          # After the append, so the signature covers the payload. Install.exe is this file, copied below.
          & .\scripts\windows\sign-authenticode.ps1 "$name-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed ($LASTEXITCODE)" }
          $hash = (Get-FileHash "$name-setup.exe" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$pwd\$name-setup.exe.sha256", "$hash  $name-setup.exe`n")
          Get-ChildItem "$name-setup.exe*" | Format-Table Name,Length

      - name: Zip (with the installer inside)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The zip's folder opens on Install.exe (the signed setup.exe), beside Install-PowerShell.cmd.
          $name = 'arcade-v1-${{ matrix.platform }}'
          Copy-Item "$name-setup.exe" "$name\Install.exe"
          if (Test-Path "$name.zip") { Remove-Item "$name.zip" -Force }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$pwd\$name.zip.sha256", "$hash  $name.zip`n")
          function Publish-Hash([string]$Path, [string]$Label) {
            $h = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLower()
            return "$h  $Label"
          }
          $lines = @(
            (Publish-Hash "$name\bin\arcaded.exe" 'arcaded.exe'),
            (Publish-Hash "$name\bin\arcade.exe" 'arcade.exe'),
            (Publish-Hash "$name\bin\arcade-desktop.exe" 'arcade-desktop.exe'),
            (Publish-Hash "$name\Install.exe" 'Install.exe'),
            (Publish-Hash "$name-setup.exe" "$name-setup.exe")
          )
          [IO.File]::WriteAllText("$pwd\$name-binaries.sha256", (($lines -join "`n") + "`n"))
          Get-ChildItem "$name.zip*", "$name-binaries.sha256", "$name-payload.sha256" | Format-Table Name,Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: arcade-v1-${{ matrix.platform }}
          path: |
            arcade-v1-${{ matrix.platform }}.zip
            arcade-v1-${{ matrix.platform }}.zip.sha256
            arcade-v1-${{ matrix.platform }}-setup.exe
            arcade-v1-${{ matrix.platform }}-setup.exe.sha256
            arcade-v1-${{ matrix.platform }}-binaries.sha256
            arcade-v1-${{ matrix.platform }}-payload.sha256

  # macOS: built from the same commit, not required yet (a failure here doesn't stop the release). The archive holds
  # the programs and scripts/install-macos.sh (launchd agent, a small app in ~/Applications); no signed .app/.dmg yet.
  macos:
    name: build ${{ matrix.platform }} (optional)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      ARCADE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Build tools
        run: |
          brew install gmp cmake
          # chiavdf finds GMP's headers and library through these (Homebrew: /opt/homebrew on Apple silicon,
          # /usr/local on Intel).
          echo "CPATH=$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --release --locked -p arcaded -p arcade-cli -p arcade-signer -p arcade-desktop

      - name: Package
        run: |
          name=arcade-v1-${{ matrix.platform }}
          mkdir -p "$name/bin" "$name/scripts"
          cp target/release/arcaded target/release/arcade target/release/arcade-signer target/release/arcade-desktop "$name/bin/"
          strip "$name"/bin/*
          cp crates/arcade-desktop/icons/icon.png crates/arcade-desktop/icons/icon.icns "$name/"
          cp scripts/install-macos.sh "$name/scripts/"
          git rev-parse HEAD > "$name/COMMIT"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcade-v1-${{ matrix.platform }}
          path: arcade-v1-${{ matrix.platform }}.tar.gz*

  release:
    # Every required build must have succeeded (not always()); macOS is waited for and attached when it built.
    needs: [build, macos]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout before the artifacts. checkout's default clean would delete a download that landed first.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: arcade-v1-*
          merge-multiple: true

      - name: Same commit everywhere
        env:
          WANT: ${{ github.sha }}
        run: |
          ls -la
          # Every archive's COMMIT must be the commit this release is tagged on, and every required platform must
          # be here: one release, one commit, every system.
          python3 - <<'PY'
          import glob, os, sys, tarfile, zipfile
          want = os.environ["WANT"]
          required = ["linux-x86_64", "linux-aarch64", "windows-x86_64"]
          def commit_of(path):
              name = os.path.basename(path)
              folder = name[:-7] if name.endswith(".tar.gz") else name[:-4]
              if name.endswith(".zip"):
                  with zipfile.ZipFile(path) as z:
                      for i in z.infolist():
                          if i.filename.replace("\\", "/") == f"{folder}/COMMIT":
                              return z.read(i).decode().strip()
              else:
                  with tarfile.open(path) as t:
                      for m in t.getmembers():
                          if m.name.lstrip("./") == f"{folder}/COMMIT":
                              return t.extractfile(m).read().decode().strip()
              return None
          bad, have = [], set()
          for path in sorted(glob.glob("arcade-v1-*.tar.gz") + glob.glob("arcade-v1-*.zip")):
              c = commit_of(path)
              print(f"{path}: {c}")
              if c != want:
                  bad.append(f"{path}: COMMIT {c!r}, not {want}")
              have.add(os.path.basename(path).removeprefix("arcade-v1-").removesuffix(".tar.gz").removesuffix(".zip"))
          bad += [f"no arcade-v1-{p} archive" for p in required if p not in have]
          if bad:
              sys.exit("refusing to publish:\n  " + "\n  ".join(bad))
          PY

      - name: Signature tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osslsigncode minisign

      - name: Sign Linux archives
        env:
          LINUX_MINISIGN_SECRET_KEY: ${{ secrets.LINUX_MINISIGN_SECRET_KEY }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: bash scripts/release/sign_linux.sh

      - name: Check hashes and signatures
        env:
          WINDOWS_SIGNING_REQUIRED: ${{ secrets.WINDOWS_CODESIGN_PFX != '' }}
          LINUX_MINISIGN_REQUIRED: ${{ secrets.LINUX_MINISIGN_SECRET_KEY != '' }}
          LINUX_GPG_REQUIRED: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}
        run: python3 scripts/release/check_release_assets.py

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # One release per version for every system: no more vX.Y.Z-windows pre-releases.
          case "$TAG" in
            *-*) echo "refusing tag $TAG: releases are plain vX.Y.Z, one for every system" >&2; exit 1 ;;
          esac
          shopt -s nullglob
          files=(arcade-v1-*)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Arcade V1.0 $TAG" \
              --notes "**Arcade V1 is beta software with no independent security audit yet. Do not use funds you can't afford to lose. Do not restore a seed phrase that holds real savings. It installs a background service that starts at login and connects to other arcades.** Read SECURITY.md (team@arcade-nodes.com) before you install. The Windows Setup.exe shows this warning and will not continue until you check the box.  Every download here is built from one commit, $GITHUB_SHA (each archive's COMMIT file says so).  **Windows 10/11 x64:** download **arcade-v1-windows-x86_64-setup.exe**, check **arcade-v1-windows-x86_64-setup.exe.sha256**, and double-click it. The installer checks the payload against the SHA-256 inside it before it extracts anything. Or download the zip, check its .sha256, unpack it, and run **Install.exe**.  **Linux** (x86_64, aarch64): download **arcade-v1-linux-<arch>.tar.gz** and its **.sha256**, run sha256sum -c, and when the release has a **.minisig** or **.asc** check that too, then run scripts/install-linux.sh --prebuilt from the archive."
          fi
