# Prebuilt downloads for the installers (scripts/install.sh, scripts/install.ps1).
#
# Push a tag like v0.1.1 (or run this workflow by hand with a version) and it builds arcaded, arcade and
# arcade-desktop for x86_64 and aarch64 on Ubuntu 22.04 (glibc 2.35: runs on Ubuntu 22.04+, Mint 21+, Debian 12+)
# and for x86_64 on Windows (MSVC; runs on Windows 10/11 x64), packs each with the icon and the matching
# installer, and attaches them to the GitHub release:
#   arcade-v1-linux-x86_64.tar.gz      (+ .sha256)
#   arcade-v1-linux-aarch64.tar.gz     (+ .sha256)
#   arcade-v1-windows-x86_64.zip       (+ .sha256)
# install.sh downloads arcade-v1-linux-<arch>.tar.gz. install.ps1 downloads arcade-v1-windows-x86_64.zip.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.1"
        required: true

# Read-only by default: the build compiles every dependency's build scripts, so it gets no write token.
# Only the release job, which builds nothing, can publish.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential pkg-config clang libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libgmp-dev cmake

      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        env:
          ARCADE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          export LIBCLANG_PATH="$(dirname "$(ls /usr/lib/llvm-*/lib/libclang.so* | head -1)")"
          export BINDGEN_EXTRA_CLANG_ARGS="-I$(gcc -print-file-name=include)"
          cargo build --release --locked -p arcaded -p arcade-cli -p arcade-desktop

      - name: Package
        run: |
          name=arcade-v1-linux-${{ matrix.arch }}
          mkdir -p "$name/bin" "$name/scripts"
          cp target/release/arcaded target/release/arcade target/release/arcade-desktop "$name/bin/"
          strip "$name"/bin/*
          cp crates/arcade-desktop/icons/icon.png "$name/icon.png"
          cp scripts/install-linux.sh "$name/scripts/"
          git rev-parse HEAD > "$name/COMMIT"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcade-v1-linux-${{ matrix.arch }}
          path: arcade-v1-linux-${{ matrix.arch }}.tar.gz*

  windows:
    runs-on: windows-latest
    env:
      # Bitcoin Core's consensus library (crate bitcoinconsensus) builds secp256k1 statically;
      # on MSVC its header declares the functions as DLL imports unless SECP256K1_STATIC is
      # defined (link errors __imp_secp256k1_*). cl.exe adds CL to every compile.
      # Core 26's pubkey.cpp also calls the ElligatorSwift module, which the crate leaves out (GNU ld
      # drops the unused call on Linux; MSVC must resolve it): compile it in too.
      CL: /DSECP256K1_STATIC /DENABLE_MODULE_ELLSWIFT=1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: "LLVM (libclang for libmdbx and chiavdf: the MSVC headers want Clang 20 or newer)"
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1.8"

      - name: MSVC headers for bindgen
        shell: pwsh
        run: . .\scripts\msvc-env.ps1

      - uses: Swatinem/rust-cache@v2

      - name: Test
        shell: pwsh
        run: |
          # chiavdf (the ARCADE chain's proof of time) links MPIR's DLLs: on the PATH for the tests.
          cargo fetch --locked
          $mpir = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" -Recurse -Directory -Filter mpir_gc_x64 | Select-Object -First 1
          if ($mpir) { $env:PATH = "$($mpir.FullName);$env:PATH" }
          cargo test --locked --workspace --exclude arcade-desktop -- --test-threads=2

      - name: Build
        shell: pwsh
        run: |
          $env:ARCADE_VERSION = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}' }
          cargo build --release --locked -p arcaded -p arcade-cli -p arcade-desktop

      - name: Package
        shell: pwsh
        run: |
          $name = 'arcade-v1-windows-x86_64'
          New-Item -ItemType Directory -Force -Path "$name\bin","$name\scripts" | Out-Null
          Copy-Item target\release\arcaded.exe,target\release\arcade.exe,target\release\arcade-desktop.exe "$name\bin\"
          # MPIR (LGPL), which chiavdf links on Windows: its DLLs beside arcaded.exe, with its license.
          $mpir = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" -Recurse -Directory -Filter mpir_gc_x64 | Select-Object -First 1
          if (-not $mpir) { throw 'MPIR (chiavdf) not found in the cargo registry' }
          Copy-Item (Join-Path $mpir.FullName 'mpir*.dll') "$name\bin\"
          Copy-Item (Join-Path $mpir.FullName 'LICENSE') "$name\bin\MPIR-LICENSE.txt"
          Copy-Item crates\arcade-desktop\icons\icon.png,crates\arcade-desktop\icons\icon.ico $name
          Copy-Item scripts\install.ps1,scripts\uninstall.ps1 "$name\scripts\"
          git rev-parse HEAD | Set-Content "$name\COMMIT" -Encoding ascii -NoNewline
          if (Test-Path "$name.zip") { Remove-Item "$name.zip" -Force }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$pwd\$name.zip.sha256", "$hash  $name.zip`n")
          Get-ChildItem "$name.zip*" | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: arcade-v1-windows-x86_64
          path: arcade-v1-windows-x86_64.zip*

  release:
    needs: [build, windows]
    if: ${{ always() && (needs.windows.result == 'success' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          ls -la
          shopt -s nullglob
          files=(arcade-v1-linux-* arcade-v1-windows-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts were built." >&2
            exit 1
          fi
          # A hyphen in the tag (v0.1.0-windows) is a pre-release. Plain tags stay releases.
          pre=()
          case "$TAG" in
            *-*) pre=(--prerelease) ;;
          esac
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
            if [ ${#pre[@]} -gt 0 ]; then
              gh release edit "$TAG" --prerelease -R "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              "${pre[@]}" \
              --title "Arcade V1.0 $TAG" \
              --notes "Prebuilt downloads: Linux (x86_64, aarch64) and Windows 10/11 x64. Linux: curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | bash  —  Windows: see README, Install on Windows."
          fi
